name: CI

on:
  push:
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lug_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lug_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.22.3
        ports:
          - 1025:1025
          - 8025:8025
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
    env:
      LUG_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lug_test
      LUG_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lug_test
      LUG_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      LUG_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r apps/api/requirements.txt ruff pytest pytest-asyncio pip-audit==2.10.1
      - run: npm audit --omit=dev --audit-level=high
      - run: pip-audit -r apps/api/requirements.txt
      - run: python scripts/migrate.py
      - run: npm run build:web
      - run: npm run check
      - run: python scripts/check-openapi.py
      - run: ruff check apps/api/app tests
      - run: ruff format --check apps/api/app tests scripts
      - run: python -m pytest -q
      - name: Start MinIO integration service
        run: |
          docker run -d --name lug-minio \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -p 9000:9000 \
            minio/minio:RELEASE.2024-06-13T22-53-53Z server /data
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9000/minio/health/ready && exit 0
            sleep 1
          done
          docker logs lug-minio
          exit 1
      - run: python -m pytest -q tests/test_s3_integration.py
      - run: npm run test:web-security
      - run: npm run test:web-modules
      - run: npm run test:web-store-errors
      - run: npm run test:build-contract
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:smoke
      - run: npm run test:smtp-local

  container-security:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          tags: elegant-bell-api:ci
          load: true
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          tags: elegant-bell-web:ci
          load: true
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: elegant-bell-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: elegant-bell-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
