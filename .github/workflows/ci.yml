name: CI

on:
  push:
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lug_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lug_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LUG_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lug_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r apps/api/requirements.txt ruff
      - run: npm run check
      - run: ruff check apps/api/app tests
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm run test:web-security
      - run: npm run test:smoke
