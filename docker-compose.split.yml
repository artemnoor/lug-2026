services:
  api:
    build: .
    restart: unless-stopped
    command: ["python", "-B", "-m", "uvicorn", "app.main:app", "--app-dir", "apps/api", "--host", "0.0.0.0", "--port", "4174", "--no-access-log"]
    env_file: [.env.production]
    environment:
      LUG_ROOT: /app
      LUG_DATA_DIR: /var/lib/lug/data
      LUG_UPLOAD_DIR: /var/lib/lug/uploads
      LUG_UPLOAD_TMP_DIR: /var/lib/lug/upload-tmp
      LUG_API_HOST: 0.0.0.0
      LUG_API_PORT: 4174
    volumes:
      - app_data:/var/lib/lug/data
      - app_upload_tmp:/var/lib/lug/upload-tmp
      - app_uploads:/var/lib/lug/uploads
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      clamav: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4174/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: ["node", "apps/web/server.js"]
    env_file: [.env.production]
    environment:
      LUG_ROOT: /app
      LUG_WEB_HOST: 0.0.0.0
      LUG_WEB_PORT: 4173
      LUG_API_HOST: api
      LUG_API_PORT: 4174
    # Public TLS is terminated by Nginx/managed LB on the host.
    ports: ["127.0.0.1:4173:4173"]
    depends_on:
      api: {condition: service_healthy}

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-B", "-m", "app.worker"]
    env_file: [.env.production]
    environment:
      LUG_ROOT: /app
      LUG_DATA_DIR: /var/lib/lug/data
      LUG_DATABASE_PROVIDER: postgres
    depends_on:
      postgres: {condition: service_healthy}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lug
      POSTGRES_USER: lug
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lug -d lug"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  clamav:
    image: clamav/clamav:1.5.4
    restart: unless-stopped
    volumes: [clamav_data_154:/var/lib/clamav]
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/clamav/clamd.sock || test -S /tmp/clamd.sock"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  app_data:
  app_upload_tmp:
  app_uploads:
  postgres_data:
  redis_data:
  clamav_data_154:
