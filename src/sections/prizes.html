<section class="lug-sec theme_on-brand" id="prizes">
  <div class="line-orbit line-orbit-double line-orbit-prizes" aria-hidden="true"></div>
  <!-- Decorative Star 3: Lime Green 8-point geometric star -->
  <div class="deco-star deco-star-3" aria-hidden="true">
    <svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M250 10 L285 185 L460 140 L315 250 L460 360 L285 315 L250 490 L215 315 L40 360 L185 250 L40 140 L215 185 Z" fill="#B8F560"></path>
    </svg>
  </div>
  <div class="lug-container">
    <div class="lug-header-block">
      <div class="prize-spotlight" aria-hidden="true">
        <svg class="prize-spotlight__beam" viewBox="0 0 160 100" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="prize-beam-falloff" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#fff9d5" stop-opacity="0"></stop>
              <stop offset="20%" stop-color="#fff3ae" stop-opacity="0.24"></stop>
              <stop offset="50%" stop-color="#fff0a0" stop-opacity="0.72"></stop>
              <stop offset="80%" stop-color="#fff3ae" stop-opacity="0.24"></stop>
              <stop offset="100%" stop-color="#fff0a0" stop-opacity="0"></stop>
            </linearGradient>
            <linearGradient id="prize-beam-core" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#fffef0" stop-opacity="0"></stop>
              <stop offset="26%" stop-color="#fffef0" stop-opacity="0.32"></stop>
              <stop offset="50%" stop-color="#fffef0" stop-opacity="0.96"></stop>
              <stop offset="74%" stop-color="#fffef0" stop-opacity="0.32"></stop>
              <stop offset="100%" stop-color="#fffef0" stop-opacity="0"></stop>
            </linearGradient>
            <linearGradient id="prize-beam-haze" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff7c8" stop-opacity="0.48"></stop>
              <stop offset="58%" stop-color="#fff3b3" stop-opacity="0.3"></stop>
              <stop offset="100%" stop-color="#fff3b3" stop-opacity="0"></stop>
            </linearGradient>
            <filter id="prize-beam-soft-edge" x="-50%" y="-60%" width="200%" height="220%">
              <feGaussianBlur stdDeviation="7"></feGaussianBlur>
            </filter>
            <filter id="prize-beam-soft-haze" x="-50%" y="-60%" width="200%" height="220%">
              <feGaussianBlur stdDeviation="10"></feGaussianBlur>
            </filter>
          </defs>
          <path d="M 80 0 C 67 28 21 78 0 100 L 160 100 C 139 78 93 28 80 0 Z" fill="url(#prize-beam-haze)" filter="url(#prize-beam-soft-haze)"></path>
          <path d="M 80 0 C 70 24 26 76 3 100 L 157 100 C 134 76 90 24 80 0 Z" fill="url(#prize-beam-falloff)" filter="url(#prize-beam-soft-edge)"></path>
          <path d="M 80 0 C 70 24 26 76 3 100 L 157 100 C 134 76 90 24 80 0 Z" fill="url(#prize-beam-core)" filter="url(#prize-beam-soft-edge)"></path>
        </svg>
        <div class="prize-spotlight__halo"></div>
        <div class="prize-spotlight__source"></div>
        <div class="prize-spotlight__floor-glow"></div>
        <div class="prize-spotlight__floor-core"></div>
        <img class="prize-spotlight__lamp" src="./assets/images/spotlight-lamp.webp" alt="" loading="lazy" draggable="false">
      </div>
      <div class="span"><h2 class="lug-title">Главный приз</h2></div>
    </div>

    <!-- Single grand-prize announcement -->
    <div class="prizes-cards-grid">
      <div class="prize-vcard is-highlight">
        <div class="prize-single-award">
          <img class="prize-single-award-art" src="./assets/images/grand-prize-trip.webp" alt="Иллюстрация главного приза конкурса" loading="lazy" draggable="false">
          <div class="prize-single-award-copy">
            <h3 class="prize-single-award-amount prize-single-award-amount--message">Поездка для всей группы</h3>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
