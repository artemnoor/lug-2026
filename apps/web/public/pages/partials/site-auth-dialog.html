<template id="siteAuthDialogTemplate">
  <dialog class="site-auth-dialog" aria-labelledby="site-auth-title">
    <form class="site-auth-dialog__card" id="siteAuthForm" novalidate>
      <svg
        class="site-auth-dialog__star"
        viewBox="0 0 100 100"
        aria-hidden="true"
      >
        <polygon
          points="50,0 58,37 88,12 67,43 100,50 64,57 88,88 57,65 50,100 42,63 12,88 35,57 0,50 36,43 12,12 43,37"
        />
      </svg>
      <div class="site-auth-dialog__intro" aria-hidden="true">
        <svg
          class="site-auth-dialog__intro-logo"
          viewBox="0 0 1254 1254"
          xmlns="http://www.w3.org/2000/svg"
          shape-rendering="geometricPrecision"
        >
          <g
            fill="none"
            stroke="currentColor"
            stroke-width="26"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle
              class="auth-logo-line auth-logo-line--1"
              pathLength="1"
              cx="629.5"
              cy="249.5"
              r="77.5"
            />
            <circle
              class="auth-logo-line auth-logo-line--2"
              pathLength="1"
              cx="434.5"
              cy="333.5"
              r="77.5"
            />
            <circle
              class="auth-logo-line auth-logo-line--2"
              pathLength="1"
              cx="824.5"
              cy="333.5"
              r="77.5"
            />
            <path
              class="auth-logo-line auth-logo-line--3"
              pathLength="1"
              d="M512 455c4-38 38-68 84-68h66c46 0 80 30 84 68"
            />
            <path
              class="auth-logo-line auth-logo-line--4"
              pathLength="1"
              d="M286 753V566c0-55 45-99 100-99h126"
            />
            <path
              class="auth-logo-line auth-logo-line--4"
              pathLength="1"
              d="M746 467h126c55 0 100 44 100 99v199"
            />
            <path
              class="auth-logo-line auth-logo-line--5"
              pathLength="1"
              d="M512 467v199a43.5 43.5 0 0 0 87 0V566c0-48-38-88-87-99"
            />
            <path
              class="auth-logo-line auth-logo-line--6"
              pathLength="1"
              d="M746 467v199a43.5 43.5 0 0 1-87 0V566c0-48-38-88-87-99"
            />
          </g>
          <path
            class="auth-logo-fill auth-logo-line--8"
            pathLength="1"
            d="M382 754h82q15 0 15 15v219h-46V790h-60q-35 0-44 34l-48 164h-41l49-178q15-56 93-56Z"
          />
          <path
            class="auth-logo-fill auth-logo-line--8"
            pathLength="1"
            d="M821 754h164v25q0 12-12 12H837v197h-46V779q0-25 30-25Z"
          />
          <path
            class="auth-logo-line auth-logo-line--7"
            pathLength="1"
            d="M536 765l42 96q14 32 67 32h20"
            fill="none"
            stroke="currentColor"
            stroke-width="46"
            stroke-linecap="butt"
            stroke-linejoin="round"
          />
          <path
            class="auth-logo-line auth-logo-line--9"
            pathLength="1"
            d="M732 765l-67 168q-14 35-58 35h-27"
            fill="none"
            stroke="currentColor"
            stroke-width="46"
            stroke-linecap="butt"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <button
        class="site-auth-dialog__close"
        type="button"
        aria-label="Закрыть окно"
      >
        ×
      </button>

      <section class="site-auth-dialog__choice" id="siteAuthChoice">
        <div class="site-auth-dialog__emblem" aria-hidden="true">
          <img src="assets/group-icon.svg" alt="" />
        </div>
        <p class="site-auth-dialog__eyebrow">
          ЛУГ 2026 · МГТУ им. Н. Э. Баумана
        </p>
        <h2 id="site-auth-title">Личный кабинет<br />конкурса</h2>
        <p class="site-auth-dialog__lead">
          Выберите действие: войти в кабинет или создать заявку команды.
        </p>
        <div class="site-auth-dialog__choice-actions">
          <div class="site-auth-dialog__choice-action">
            <p>Уже зарегистрированы?</p>
            <button type="button" data-auth-mode="login">Войти</button>
            <small>По почте и паролю</small>
          </div>
          <div class="site-auth-dialog__choice-action">
            <p>Впервые на конкурсе?</p>
            <button type="button" data-auth-mode="register">
              Зарегистрироваться
            </button>
            <small>Создать команду или войти по приглашению</small>
          </div>
        </div>
        <p class="site-auth-dialog__footer">
          Не уверены, что выбрать?
          <a href="mailto:lug@bmstu.ru?subject=Вопрос%20по%20участию"
            >Написать организаторам</a
          >
        </p>
      </section>

      <section class="site-auth-dialog__login" id="siteAuthLogin" hidden>
        <button
          class="site-auth-dialog__back"
          type="button"
          data-auth-mode="choice"
        >
          <span aria-hidden="true">←</span> Назад
        </button>
        <h2 id="site-auth-login-title">Войти<br />в кабинет</h2>
        <p class="site-auth-dialog__lead">
          Введите почту и пароль. После входа откроется ваш конкурсный маршрут.
        </p>
        <p
          class="site-auth-dialog__verify-status"
          id="siteAuthLoginStatus"
          role="status"
          aria-live="polite"
        ></p>
        <label
          >Электронная почта<input
            data-auth-field="login"
            id="siteAuthEmail"
            type="email"
            autocomplete="username"
            placeholder="you@example.com"
            required
        /></label>
        <label
          >Пароль<input
            data-auth-field="login"
            id="siteAuthPassword"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
        /></label>
        <p class="site-auth-dialog__error" id="siteAuthError" role="alert"></p>
        <button
          class="site-auth-dialog__submit"
          id="siteAuthLoginSubmit"
          type="submit"
        >
          Войти <span aria-hidden="true">→</span>
        </button>
        <p class="site-auth-dialog__footer">
          Не помните пароль?
          <button
            class="site-auth-dialog__inline-link"
            type="button"
            data-auth-mode="recovery"
          >
            Восстановить доступ
          </button>
        </p>
      </section>

      <section class="site-auth-dialog__login" id="siteAuthRecovery" hidden>
        <button
          class="site-auth-dialog__back"
          type="button"
          data-auth-mode="login"
        >
          <span aria-hidden="true">←</span> Вернуться ко входу
        </button>
        <p class="site-auth-dialog__eyebrow">Восстановление доступа</p>
        <h2 id="site-auth-recovery-title">Вернуть<br />доступ</h2>
        <div id="siteRecoveryRequestStep">
          <p class="site-auth-dialog__lead">
            Укажите почту, которую использовали при регистрации. Мы отправим на
            неё код восстановления.
          </p>
          <label
            >Электронная почта<input
              data-auth-field="recovery"
              id="siteRecoveryEmail"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
          /></label>
          <p
            class="site-auth-dialog__error"
            id="siteAuthRecoveryError"
            role="alert"
          ></p>
          <button
            class="site-auth-dialog__submit"
            id="siteAuthRecoveryRequestSubmit"
            type="submit"
          >
            Отправить код <span aria-hidden="true">→</span>
          </button>
        </div>
        <div id="siteRecoveryResetStep" hidden>
          <p class="site-auth-dialog__lead">
            Код отправлен на
            <strong id="siteRecoveryVerificationEmail"></strong>. Введите его и
            задайте новый пароль.
          </p>
          <label
            >Код восстановления<input
              data-auth-field="recovery"
              id="siteRecoveryCode"
              inputmode="numeric"
              autocomplete="one-time-code"
              pattern="[0-9]{6}"
              minlength="6"
              maxlength="6"
              placeholder="000000"
              required
          /></label>
          <div class="site-auth-dialog__password-field">
            <label for="siteRecoveryPassword">Новый пароль</label>
            <div class="site-auth-dialog__password-control">
              <input
                data-auth-field="recovery"
                id="siteRecoveryPassword"
                type="password"
                minlength="8"
                autocomplete="new-password"
                placeholder="Придумайте пароль"
                aria-describedby="siteRecoveryPasswordRules"
                required
              /><button
                type="button"
                class="site-auth-dialog__password-toggle"
                data-password-toggle="siteRecoveryPassword"
                aria-pressed="false"
              >
                Показать
              </button>
            </div>
            <ul
              class="site-auth-dialog__password-rules"
              id="siteRecoveryPasswordRules"
              aria-live="polite"
            >
              <li data-recovery-password-rule="length">8 символов</li>
              <li data-recovery-password-rule="case">
                строчная и прописная буква
              </li>
              <li data-recovery-password-rule="number">цифра</li>
              <li data-recovery-password-rule="special">спецсимвол</li>
            </ul>
          </div>
          <div class="site-auth-dialog__password-field">
            <label for="siteRecoveryPasswordConfirm">Повторите пароль</label>
            <div class="site-auth-dialog__password-control">
              <input
                data-auth-field="recovery"
                id="siteRecoveryPasswordConfirm"
                type="password"
                minlength="8"
                autocomplete="new-password"
                placeholder="Повторите пароль"
                aria-describedby="siteRecoveryPasswordMatch"
                required
              /><button
                type="button"
                class="site-auth-dialog__password-toggle"
                data-password-toggle="siteRecoveryPasswordConfirm"
                aria-pressed="false"
              >
                Показать
              </button>
            </div>
            <p
              class="site-auth-dialog__password-match"
              id="siteRecoveryPasswordMatch"
              role="status"
              aria-live="polite"
            ></p>
          </div>
          <p
            class="site-auth-dialog__verify-status"
            id="siteAuthRecoveryStatus"
            role="status"
            aria-live="polite"
          ></p>
          <p
            class="site-auth-dialog__error"
            id="siteAuthRecoveryResetError"
            role="alert"
          ></p>
          <button
            class="site-auth-dialog__submit"
            id="siteAuthRecoveryResetSubmit"
            type="submit"
          >
            Сохранить новый пароль <span aria-hidden="true">→</span>
          </button>
          <button
            class="site-auth-dialog__inline-link site-auth-dialog__resend"
            id="siteAuthRecoveryResend"
            type="button"
          >
            Отправить код ещё раз
          </button>
        </div>
      </section>

      <section class="site-auth-dialog__register" id="siteAuthRegister" hidden>
        <button
          class="site-auth-dialog__back"
          type="button"
          data-auth-mode="choice"
        >
          <span aria-hidden="true">←</span> Назад
        </button>
        <p class="site-auth-dialog__eyebrow">Регистрация участника</p>
        <h2 id="site-auth-register-title">Как<br />участвовать?</h2>
        <p class="site-auth-dialog__lead">
          Выберите сценарий. Форму можно заполнить прямо здесь — отдельная
          страница не нужна.
        </p>
        <div
          class="site-auth-dialog__switch"
          role="tablist"
          aria-label="Сценарий регистрации"
        >
          <button
            type="button"
            role="tab"
            data-register-mode="captain"
            aria-selected="true"
          >
            Создать команду
          </button>
          <button
            type="button"
            role="tab"
            data-register-mode="participant"
            aria-selected="false"
          >
            По приглашению
          </button>
        </div>

        <div
          class="site-auth-dialog__register-panel"
          id="siteAuthCaptainPanel"
          data-register-panel="captain"
        >
          <p class="site-auth-dialog__section-note">
            Капитан создаёт команду своей учебной группы и затем приглашает
            одногруппников.
          </p>
          <div class="site-auth-dialog__field-grid">
            <div
              class="site-auth-dialog__field-group site-auth-dialog__field--wide"
            >
              <span class="site-auth-dialog__field-group-title"
                >Фамилия, имя и отчество</span
              >
              <div class="site-auth-dialog__fio-grid">
                <label
                  >Фамилия<input
                    data-auth-field="captain"
                    id="siteCapSurname"
                    type="text"
                    autocomplete="family-name"
                    placeholder="Иванов"
                    required
                /></label>
                <label
                  >Имя<input
                    data-auth-field="captain"
                    id="siteCapName"
                    type="text"
                    autocomplete="given-name"
                    placeholder="Иван"
                    required
                /></label>
                <label
                  >Отчество<input
                    data-auth-field="captain"
                    id="siteCapPatronymic"
                    type="text"
                    autocomplete="additional-name"
                    placeholder="Иванович"
                    required
                /></label>
              </div>
            </div>
            <label
              >Учебная группа<input
                data-auth-field="captain"
                id="siteCapGroup"
                type="text"
                placeholder="Например, ИУ7-41Б"
                required
            /></label>
            <label
              >Студентов в группе<input
                data-auth-field="captain"
                id="siteCapGroupSize"
                type="number"
                min="1"
                step="1"
                inputmode="numeric"
                placeholder="Например, 25"
                required
            /></label>
            <label class="site-auth-dialog__field--wide"
              >Название команды<input
                data-auth-field="captain"
                id="siteCapTeamName"
                type="text"
                placeholder="Например, Ракета ИУ7"
                required
            /></label>
            <label class="site-auth-dialog__field--wide"
              >Электронная почта<input
                data-auth-field="captain"
                id="siteCapEmail"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
            /></label>
            <fieldset
              class="site-auth-dialog__messenger-picker site-auth-dialog__field--wide"
              data-messenger-owner="captain"
            >
              <legend>Мессенджеры</legend>
              <p class="site-auth-dialog__field-help">
                Выберите, как с вами можно связаться.
              </p>
              <div
                class="site-auth-dialog__messenger-options"
                role="group"
                aria-label="Способы связи капитана"
              >
                <button
                  type="button"
                  class="site-auth-dialog__messenger-option"
                  data-messenger-owner="captain"
                  data-messenger="telegram"
                  aria-pressed="false"
                >
                  <img src="assets/messenger-telegram.svg" alt="" /><span
                    >Telegram</span
                  ><span
                    class="site-auth-dialog__messenger-check"
                    aria-hidden="true"
                    >✓</span
                  >
                </button>
                <button
                  type="button"
                  class="site-auth-dialog__messenger-option"
                  data-messenger-owner="captain"
                  data-messenger="vk"
                  aria-pressed="false"
                >
                  <img src="assets/messenger-vk.svg" alt="" /><span>VK</span
                  ><span
                    class="site-auth-dialog__messenger-check"
                    aria-hidden="true"
                    >✓</span
                  >
                </button>
                <button
                  type="button"
                  class="site-auth-dialog__messenger-option"
                  data-messenger-owner="captain"
                  data-messenger="max"
                  aria-pressed="false"
                >
                  <img src="assets/messenger-max.svg" alt="" /><span>MAX</span
                  ><span
                    class="site-auth-dialog__messenger-check"
                    aria-hidden="true"
                    >✓</span
                  >
                </button>
              </div>
              <div
                class="site-auth-dialog__messenger-contacts"
                data-messenger-contacts="captain"
                aria-live="polite"
              ></div>
              <p
                class="site-auth-dialog__messenger-status"
                data-messenger-status="captain"
                role="status"
              >
                Способ связи ещё не выбран
              </p>
            </fieldset>
          </div>
          <div class="site-auth-dialog__upload" data-dropzone="captain">
            <div class="site-auth-dialog__upload-head">
              <span class="site-auth-dialog__upload-icon" aria-hidden="true"
                ><svg viewBox="0 0 24 24">
                  <path
                    d="M4 7.5A2.5 2.5 0 0 1 6.5 5h2l1.1-1.5h4.8L15.5 5h2A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"
                  />
                  <circle cx="12" cy="12" r="3.5" /></svg
              ></span>
              <span class="site-auth-dialog__upload-copy"
                ><span class="site-auth-dialog__upload-title"
                  >Подтверждение студента</span
                ><strong>Фото личного кабинета</strong
                ><small
                  >Сфотографируйте экран или выберите фото/PDF · до 5 МБ.</small
                ></span
              >
            </div>
            <input
              class="site-auth-dialog__file-input"
              data-auth-field="captain"
              id="siteCapStudentCardFile"
              type="file"
              accept="image/*,.pdf"
              aria-label="Выбрать фото личного кабинета"
              tabindex="-1"
            />
            <div class="site-auth-dialog__upload-controls">
              <button
                class="site-auth-dialog__upload-choose"
                data-auth-field="captain"
                data-upload-trigger
                data-upload-owner="captain"
                type="button"
                aria-controls="siteCapStudentCardFile"
                aria-describedby="siteCapFilePreview"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" /></svg
                ><span data-upload-action>Выбрать фото</span>
              </button>
              <button
                class="site-auth-dialog__upload-clear"
                data-auth-field="captain"
                data-upload-clear
                data-upload-owner="captain"
                type="button"
                hidden
              >
                Удалить
              </button>
            </div>
            <p
              class="site-auth-dialog__file-status"
              id="siteCapFilePreview"
              role="status"
              aria-live="polite"
            >
              Файл не выбран
            </p>
            <div
              class="site-auth-dialog__file-preview"
              data-upload-preview-wrap
              hidden
            >
              <img data-upload-preview alt="Предпросмотр выбранного фото" />
            </div>
            <small class="site-auth-dialog__upload-desktop-hint"
              >На компьютере можно также перетащить файл сюда · JPG, PNG, WEBP
              или PDF до 5 МБ.</small
            >
          </div>
          <div
            class="site-auth-dialog__field-grid site-auth-dialog__password-grid"
          >
            <div class="site-auth-dialog__password-field">
              <label for="siteCapPassword">Пароль</label>
              <div class="site-auth-dialog__password-control">
                <input
                  data-auth-field="captain"
                  data-password="captain"
                  id="siteCapPassword"
                  type="password"
                  minlength="8"
                  autocomplete="new-password"
                  placeholder="Придумайте пароль"
                  aria-describedby="siteCapPasswordRules"
                  required
                /><button
                  type="button"
                  class="site-auth-dialog__password-toggle"
                  data-password-toggle="siteCapPassword"
                  aria-pressed="false"
                >
                  Показать
                </button>
              </div>
              <ul
                class="site-auth-dialog__password-rules"
                id="siteCapPasswordRules"
                data-password-rules="captain"
                aria-live="polite"
              >
                <li data-password-rule="length">8 символов</li>
                <li data-password-rule="case">строчная и прописная буква</li>
                <li data-password-rule="number">цифра</li>
                <li data-password-rule="special">спецсимвол</li>
              </ul>
            </div>
            <div class="site-auth-dialog__password-field">
              <label for="siteCapPasswordConfirm">Повторите пароль</label>
              <div class="site-auth-dialog__password-control">
                <input
                  data-auth-field="captain"
                  data-password-confirm="captain"
                  id="siteCapPasswordConfirm"
                  type="password"
                  minlength="8"
                  autocomplete="new-password"
                  placeholder="Повторите пароль"
                  aria-describedby="siteCapPasswordMatch"
                  required
                /><button
                  type="button"
                  class="site-auth-dialog__password-toggle"
                  data-password-toggle="siteCapPasswordConfirm"
                  aria-pressed="false"
                >
                  Показать
                </button>
              </div>
              <p
                class="site-auth-dialog__password-match"
                id="siteCapPasswordMatch"
                role="status"
                aria-live="polite"
              ></p>
            </div>
          </div>
          <label class="site-auth-dialog__consent"
            ><input
              data-auth-field="captain"
              id="siteCapConsent"
              type="checkbox"
              required
            /><span
              >Согласен(на) на обработку
              <a href="privacy.html" target="_blank" rel="noopener"
                >персональных данных</a
              >
              для конкурса.</span
            ></label
          >
        </div>

        <div
          class="site-auth-dialog__register-panel"
          id="siteAuthParticipantPanel"
          data-register-panel="participant"
          hidden
        >
          <p class="site-auth-dialog__section-note">
            Укажите код от капитана — команда и учебная группа подставятся
            автоматически.
          </p>
          <div class="site-auth-dialog__field-grid">
            <label class="site-auth-dialog__field--wide"
              >Код приглашения<input
                data-auth-field="participant"
                id="siteJoinInviteCode"
                type="text"
                placeholder="Например, IU7-41B-2026"
                required
            /></label>
            <p
              class="site-auth-dialog__invite-status"
              id="siteInviteStatus"
              role="status"
            ></p>
            <label
              >Команда<input
                id="siteJoinTeamName"
                type="text"
                placeholder="Определится по коду"
                readonly
            /></label>
            <label
              >Учебная группа<input
                id="siteJoinGroup"
                type="text"
                placeholder="Определится по коду"
                readonly
            /></label>
            <div
              class="site-auth-dialog__field-group site-auth-dialog__field--wide"
            >
              <span class="site-auth-dialog__field-group-title"
                >Фамилия, имя и отчество</span
              >
              <div class="site-auth-dialog__fio-grid">
                <label
                  >Фамилия<input
                    data-auth-field="participant"
                    id="siteJoinSurname"
                    type="text"
                    autocomplete="family-name"
                    placeholder="Иванова"
                    required
                /></label>
                <label
                  >Имя<input
                    data-auth-field="participant"
                    id="siteJoinName"
                    type="text"
                    autocomplete="given-name"
                    placeholder="Мария"
                    required
